<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bapa Sitaram Diamond — Production & Dispatch System</title>
<meta name="description" content="Diamond production, work verification, real-time stock and live dispatch tracking for Bapa Sitaram Diamond Company.">
<meta name="theme-color" content="#0e1130">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   BAPA SITARAM DIAMOND — Design System
   Deep-navy corporate (ref: Giriraj prototype #0e1130) + champagne gold.
   ======================================================================= */
:root{
  --navy:#0e1130;          /* brand anchor — sidebar / header */
  --navy-2:#171b42;
  --navy-3:#232a5c;
  --brand:#2b337a;         /* interactive brand */
  --brand-600:#353f93;
  --brand-500:#4756b4;
  --brand-400:#6775cf;
  --gold:#b98f33;          /* champagne gold accent */
  --gold-soft:#e0c074;
  --ink:#13162a;
  --ink-2:#464c66;
  --ink-3:#7e849c;
  --line:#e5e7f0;
  --line-2:#eef0f7;
  --bg:#f4f5fb;
  --panel:#ffffff;
  --panel-2:#f9fafd;
  --ok:#1f9254; --ok-bg:#e7f5ec;
  --warn:#b7791f; --warn-bg:#fdf4e3;
  --bad:#c0392b; --bad-bg:#fdecea;
  --info:#2b63c7; --info-bg:#e9f0fc;
  --purple:#6d49c4; --purple-bg:#efe9fb;
  --teal:#0f8e8e; --teal-bg:#e2f4f4;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(14,17,48,.05),0 4px 16px rgba(14,17,48,.06);
  --shadow-lg:0 10px 44px rgba(14,17,48,.18);
  --sidebar-w:250px; --header-h:62px;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --navy:#0a0c22; --navy-2:#11152f; --navy-3:#1c2550;
  --brand:#8f9be6; --brand-600:#7e8ce0; --brand-500:#6f7ed9; --brand-400:#5f70d1;
  --gold:#e0c074; --gold-soft:#b98f33;
  --ink:#e9ebf5; --ink-2:#aab0c8; --ink-3:#7c8299;
  --line:#2a2f4a; --line-2:#222642;
  --bg:#0f1124; --panel:#171a33; --panel-2:#1d2140;
  --ok:#4ade80; --ok-bg:#15291d;
  --warn:#eab54a; --warn-bg:#2a2412;
  --bad:#f08b7e; --bad-bg:#2c1816;
  --info:#7cb3ec; --info-bg:#14213a;
  --purple:#b79af0; --purple-bg:#211a3a;
  --teal:#5fd0d0; --teal-bg:#122a2a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 10px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* utility */
.muted{color:var(--ink-3)}.sub{color:var(--ink-2)}.mono{font-family:var(--mono)}
.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}
.flex{display:flex}.flex-col{display:flex;flex-direction:column}
.items-center{align-items:center}.items-start{align-items:flex-start}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.wrap{flex-wrap:wrap}.grow{flex:1}.hidden{display:none !important}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}
.w-full{width:100%}.fw-600{font-weight:600}.fw-700{font-weight:700}.fw-800{font-weight:800}
.fs-11{font-size:11px}.fs-12{font-size:12px}.fs-13{font-size:13px}.fs-16{font-size:16px}.fs-18{font-size:18px}.fs-22{font-size:22px}.fs-26{font-size:26px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-ok{color:var(--ok);background:var(--ok-bg)}
.badge-warn{color:var(--warn);background:var(--warn-bg)}
.badge-bad{color:var(--bad);background:var(--bad-bg)}
.badge-info{color:var(--info);background:var(--info-bg)}
.badge-purple{color:var(--purple);background:var(--purple-bg)}
.badge-teal{color:var(--teal);background:var(--teal-bg)}
.badge-mut{color:var(--ink-2);background:var(--line-2)}
.badge-gold{color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--line-2);font-size:12px;color:var(--ink-2);font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-gold:hover{filter:brightness(.96)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(.96)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(.96)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--line-2)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-icon{padding:7px;width:34px;height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.card-head h3{font-size:15px;font-weight:700}
.panel-title{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--brand))}
.stat .label{font-size:12.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:7px}
.stat .value{font-size:25px;font-weight:800;margin-top:7px;letter-spacing:-.02em}
.stat .meta{font-size:12px;margin-top:5px;color:var(--ink-2)}
.stat .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.stat .ic svg{width:17px;height:17px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tbody tr{transition:.1s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl tr.clickable{cursor:pointer}
table.tbl th.r,table.tbl td.r{text-align:right}
.tbl-empty{padding:46px 20px;text-align:center;color:var(--ink-3)}
.tbl-empty svg{width:38px;height:38px;opacity:.4;margin-bottom:10px}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field label .req{color:var(--bad)}
.input,.select,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);transition:.12s}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-500) 16%,transparent)}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.field .errmsg{font-size:11.5px;color:var(--bad);margin-top:5px;display:none}
.field.invalid .errmsg{display:block}
.field.invalid .input{border-color:var(--bad)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand-500)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;flex-wrap:nowrap}
.seg button{padding:7px 13px;border:none;background:var(--panel);color:var(--ink-2);font-size:12.5px;font-weight:600;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--brand);color:#fff}

/* pagination */
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);flex-wrap:wrap;gap:10px}
.pager .pages{display:flex;gap:4px}
.pager .pages button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:6px;color:var(--ink-2);font-weight:600}
.pager .pages button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.pager .pages button:disabled{opacity:.4}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(9,11,30,.55);backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:pop .18s}
.modal.lg{max-width:780px}.modal.sm{max-width:430px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 var(--radius) var(--radius);flex-wrap:wrap}
.x-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);background:transparent;border-radius:7px;color:var(--ink-2);font-weight:700;font-size:12.5px;white-space:nowrap}
.x-btn .act-ic{display:inline-flex}.x-btn .act-ic svg{width:15px;height:15px}
.x-btn:hover{background:var(--line-2);color:var(--ink)}

/* toast */
#toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:slidein .2s}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.toast svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.toast .t-title{font-weight:700;font-size:13.5px}
.toast .t-msg{font-size:12.5px;color:var(--ink-2);margin-top:2px}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ===== LOGIN / ROLE PICKER ===== */
#login-screen{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1.1fr .9fr}
.login-brand{background:radial-gradient(1200px 500px at 20% -10%,#242c66 0%,var(--navy) 55%);color:#fff;padding:46px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand .facet{position:absolute;border:1px solid rgba(255,255,255,.06);transform:rotate(45deg)}
.lf1{width:340px;height:340px;top:-90px;right:-80px;animation:drift 18s ease-in-out infinite}
.lf2{width:200px;height:200px;bottom:-50px;left:-40px;animation:drift 24s ease-in-out infinite reverse}
.lf3{width:130px;height:130px;top:46%;right:18%;opacity:.5;animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(54deg) scale(1.05)}}
.login-hero-gem{position:absolute;top:46%;right:46px;width:150px;height:150px;transform:translateY(-50%);opacity:.13;perspective:600px}
.login-hero-gem svg{width:100%;height:100%;color:var(--gold-soft);animation:spin3d 16s linear infinite}
@keyframes spin3d{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.spark{position:absolute;color:var(--gold-soft);opacity:0;animation:tw 3.2s ease-in-out infinite}
.spark svg{width:100%;height:100%;fill:currentColor;stroke:none}
.sp1{top:22%;left:30%;width:16px;height:16px;animation-delay:.2s}.sp2{top:58%;left:58%;width:22px;height:22px;animation-delay:1.3s}
.sp3{top:72%;left:24%;width:13px;height:13px;animation-delay:2.1s}.sp4{top:34%;left:74%;width:12px;height:12px;animation-delay:1.7s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(20deg)}}
.login-logo{display:flex;align-items:center;gap:13px;position:relative;z-index:1}
.login-logo .gem{width:42px;height:42px;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.login-logo .co{font-size:20px;font-weight:800;letter-spacing:-.01em}
.login-logo .co small{display:block;font-size:11px;font-weight:600;color:var(--gold-soft);letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
.login-hero{position:relative;z-index:1}
.login-hero h1{font-size:31px;font-weight:800;line-height:1.18;margin-bottom:14px;letter-spacing:-.02em}
.login-hero p{font-size:15px;opacity:.85;max-width:430px}
.login-hero .feats{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.login-hero .feats div{display:flex;align-items:center;gap:12px;font-size:14px;opacity:.94}
.login-hero .fic{width:28px;height:28px;border-radius:8px;background:rgba(224,192,116,.14);display:grid;place-items:center;flex-shrink:0}
.login-hero .fic svg{width:15px;height:15px;color:var(--gold-soft)}
.login-foot{position:relative;z-index:1;font-size:12px;opacity:.55}
.login-form-wrap{background:var(--panel);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;overflow-y:auto}
.login-form{width:100%;max-width:390px}
.login-mini{display:none;align-items:center;gap:11px;margin-bottom:26px}
.login-mini .gem{width:34px;height:34px}
.login-mini .co{font-size:17px;font-weight:800}
.login-mini .co small{display:block;font-size:10px;font-weight:600;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.login-form h2{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.login-form .lead{color:var(--ink-3);margin-bottom:22px;font-size:14px}
.in-field{margin-bottom:15px}
.in-field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.in-wrap{position:relative;display:flex;align-items:center}
.in-wrap .lead-ic{position:absolute;left:12px;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.in-wrap input{width:100%;padding:11px 42px 11px 38px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font-size:14px}
.in-wrap input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-500) 16%,transparent)}
.pw-toggle{position:absolute;right:6px;width:32px;height:32px;border:none;background:transparent;border-radius:6px;color:var(--ink-3);display:grid;place-items:center}
.pw-toggle:hover{background:var(--line-2);color:var(--ink)}.pw-toggle svg{width:17px;height:17px}
.login-btn{width:100%;padding:12px;font-size:14.5px;margin-top:4px}
.or-div{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--ink-3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.or-div::before,.or-div::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.demo-role{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;transition:.12s;background:var(--panel);font-family:inherit;text-align:left}
.demo-role:hover{border-color:var(--brand-500);background:var(--panel-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.demo-role .dr-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.demo-role .dr-ic svg{width:17px;height:17px}
.demo-role .dr-name{font-weight:700;font-size:13px;color:var(--ink)}
.demo-role .dr-user{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.demo-note{font-size:11.5px;color:var(--ink-3);margin-top:13px;text-align:center;line-height:1.6}
@media(max-width:880px){#login-screen{grid-template-columns:1fr}.login-brand{display:none}.login-mini{display:flex}.login-form-wrap{padding:30px 22px}}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--navy);color:#c4cae6;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.sb-logo{height:var(--header-h);display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);color:#fff}
.sb-logo .gem{width:30px;height:30px;flex-shrink:0}
.sb-logo .co{font-weight:800;font-size:15px}
.sb-logo .co small{display:block;font-size:9.5px;font-weight:600;color:var(--gold-soft);letter-spacing:.07em;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-color:transparent}
.sb-sec{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.36);padding:14px 12px 6px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#c4cae6;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s;position:relative}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:var(--brand);color:#fff;font-weight:600}
.sb-item svg{width:17px;height:17px;flex-shrink:0;opacity:.92}
.sb-item .count{margin-left:auto;background:rgba(255,255,255,.16);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.sb-item .count.alert{background:var(--gold);color:#241c08}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}
.sb-user:hover{background:rgba(255,255,255,.07)}
.sb-user .av{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#241c08;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.sb-user .u-name{font-size:13px;font-weight:600;color:#fff}
.sb-user .u-role{font-size:11px;color:var(--gold-soft)}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;min-width:0;overflow-x:hidden}
.topbar{height:var(--header-h);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar .pg-titles{min-width:0;overflow:hidden}
.topbar .pg-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pg-crumb{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1;min-width:8px}
.hamb{display:none;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;place-items:center}
.lang-btn{height:36px;min-width:46px;padding:0 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--brand);font-weight:800;font-size:12px;letter-spacing:.03em}
.lang-btn:hover{background:var(--panel-2);border-color:var(--brand-500)}
.lang-seg{display:inline-flex;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:3px;gap:2px}
.lang-seg .lang-opt{border:0;background:transparent;border-radius:6px;padding:0 11px;font-weight:800;font-size:12.5px;color:var(--ink-2);cursor:pointer;letter-spacing:.01em;transition:background .12s,color .12s;white-space:nowrap}
.lang-seg .lang-opt:hover{color:var(--ink)}
.lang-seg .lang-opt.on{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}.icon-btn svg{width:18px;height:18px}
.icon-btn .ndot{position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--bad);border-radius:50%;border:2px solid var(--panel)}
/* Labeled top-bar buttons (theme / sign out) — text so non-tech users can read them */
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--ink-2);font-weight:700;font-size:12.5px;white-space:nowrap}
.tb-btn svg{width:17px;height:17px}
.tb-btn:hover{background:var(--panel-2);color:var(--ink)}
.tb-btn.tb-out{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,var(--line))}
.tb-btn.tb-out:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
/* Labeled row-action buttons — every table action shows its name, not just an icon */
.row-acts{display:flex;gap:7px;flex-wrap:wrap}
.act-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.act-btn .act-ic{display:inline-flex}.act-btn .act-ic svg{width:15px;height:15px}
.act-btn.act-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,var(--line))}
.act-btn.act-danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.content{padding:22px;flex:1;max-width:1500px;width:100%}
.page-head{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--ink-3);font-size:13.5px;margin-top:3px}

/* dropdown */
.dropdown{position:absolute;top:46px;right:0;width:344px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:60;overflow:hidden}
.dd-head{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.dd-list{max-height:400px;overflow-y:auto}
.dd-item{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:11px;align-items:flex-start}
.dd-item:hover{background:var(--panel-2)}
.dd-item .di-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.dd-item .di-title{font-size:13px;font-weight:600}
.dd-item .di-msg{font-size:12px;color:var(--ink-2);margin-top:1px}
.dd-item .di-time{font-size:11px;color:var(--ink-3);margin-top:3px}
.dd-item.unread{background:color-mix(in srgb,var(--brand-500) 5%,transparent)}

/* charts */
.barchart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bc-bars{width:100%;display:flex;gap:3px;align-items:flex-end;height:100%;justify-content:center}
.bc-bar{width:18px;border-radius:3px 3px 0 0;min-height:2px;transition:.3s}
.bc-label{font-size:11px;color:var(--ink-3);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.donut{width:150px;height:150px;flex-shrink:0}
.prog{height:7px;background:var(--line-2);border-radius:10px;overflow:hidden}.prog>i{display:block;height:100%;border-radius:10px;background:var(--brand-500)}

/* detail / kv */
.detail-grid{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:none}.kv .k{color:var(--ink-3)}.kv .v{font-weight:600;text-align:right}
.avatar-lg{width:64px;height:64px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 16px;border:none;background:transparent;color:var(--ink-3);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--brand);border-bottom-color:var(--gold)}

/* banners */
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px}
.banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.banner-info{background:var(--info-bg);color:var(--info)}
.banner-warn{background:var(--warn-bg);color:var(--warn)}
.banner-gold{background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold)}
.banner strong{font-weight:700}
.assume{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);padding:2px 8px;border-radius:5px}
.confidential{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-bg);padding:2px 8px;border-radius:5px}

.denied{text-align:center;padding:70px 20px;color:var(--ink-3)}
.denied svg{width:52px;height:52px;opacity:.5;margin-bottom:14px}

/* ===== PIPELINE / STAGE TRACKER ===== */
.pipeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 0}
.pipe-step{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.pipe-step::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.pipe-step:first-child::before{display:none}
.pipe-step .ps-dot{width:36px;height:36px;border-radius:50%;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;position:relative;z-index:1;color:var(--ink-3)}
.pipe-step .ps-dot svg{width:16px;height:16px}
.pipe-step .ps-label{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--ink-3)}
.pipe-step .ps-time{font-size:10px;color:var(--ink-3);margin-top:2px}
.pipe-step.done .ps-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.pipe-step.done::before{background:var(--ok)}
.pipe-step.current .ps-dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 22%,transparent)}
.pipe-step.current .ps-label{color:var(--brand);font-weight:700}
.pipe-step.rework .ps-dot{background:var(--bad);border-color:var(--bad);color:#fff}

/* timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 0}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--brand)}
.tl-item.rework::before{background:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.tl-item .tl-title{font-size:13.5px;font-weight:600}
.tl-item .tl-meta{font-size:12px;color:var(--ink-3)}

/* ===== DISPATCH MAP ===== */
.map-box{height:340px;border-radius:var(--radius);position:relative;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(0deg,var(--line-2) 1px,transparent 1px) 0 0/100% 38px,
  linear-gradient(90deg,var(--line-2) 1px,transparent 1px) 0 0/38px 100%,var(--panel-2)}
.map-route{position:absolute;height:3px;background:repeating-linear-gradient(90deg,var(--brand) 0 8px,transparent 8px 15px);top:50%;left:12%;right:12%;transform:translateY(-50%);border-radius:2px}
.map-node{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;z-index:2}
.map-node .mn-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.map-node .mn-lbl{font-size:11px;font-weight:600;background:var(--panel);padding:2px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.map-truck{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:3;transition:left 1s linear}
.map-truck .mt-ic{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#241c08;display:grid;place-items:center;box-shadow:0 4px 14px rgba(185,143,51,.5);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.map-truck .mt-ic svg{width:21px;height:21px}
.live-chip{position:absolute;top:12px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;z-index:4}
.live-chip .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.map-eta{position:absolute;bottom:12px;left:12px;right:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:4;flex-wrap:wrap;gap:8px}

@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}.hamb{display:grid}.content{padding:18px}
}
#sb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;display:none}
#sb-backdrop.show{display:block}
@media(min-width:1025px){#sb-backdrop{display:none !important}}
@media(max-width:768px){
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat .value{font-size:21px}.page-head h1{font-size:19px}.content{padding:14px}
  .topbar{padding:0 12px;gap:8px}.card-pad{padding:14px}
  .topbar .pg-crumb{display:none}.topbar .pg-title{font-size:15px}
  .lang-seg{height:34px}.lang-seg .lang-opt{padding:0 9px;font-size:12px}
  .tb-btn{height:34px;padding:0 10px;gap:5px;font-size:12px}
  .tabs button{padding:10px 12px;font-size:13px}
  .map-box{height:260px}
  .detail-grid{grid-template-columns:1fr}
  /* keep toasts clear of the top bar controls on mobile */
  #toasts{top:calc(var(--header-h) + 8px);left:12px;right:12px;max-width:none}
}
@media(max-width:560px){
  .stat-grid{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat .value{font-size:18px}.stat .ic{display:none}
  .page-head{flex-direction:column;align-items:stretch;gap:10px}.page-head h1{font-size:18px}
  .page-head .acts{width:100%;display:flex;flex-direction:column;gap:8px}.page-head .acts .btn{width:100%}
  .search{max-width:none;width:100%}.seg{max-width:100%;overflow-x:auto}.seg button{flex:1 0 auto;white-space:nowrap}
  .row-acts{gap:6px}.act-btn{padding:6px 9px;font-size:12px}
  .modal-foot{flex-direction:column-reverse}.modal-foot .btn{width:100%}
  table.tbl th,table.tbl td{padding:9px 10px;font-size:12.5px}
  .card-head{gap:8px;padding:13px 15px}.pager{flex-direction:column;align-items:flex-start}
  .demo-grid{grid-template-columns:1fr}.donut-wrap{flex-direction:column;align-items:flex-start}
  .barchart{height:140px}.bc-bar{width:12px}
}
@media(max-width:440px){
  /* very small phones: keep the icon but drop the Theme word so the bar never overflows */
  .tb-btn#theme-btn span{display:none}
  .tb-btn#theme-btn{padding:0 9px}
  .topbar{gap:7px;padding:0 10px}
  .tb-btn{font-size:11.5px;padding:0 8px}
  .lang-seg .lang-opt{padding:0 8px;font-size:11.5px}
  .map-box{height:220px}
}
@media(max-width:380px){.stat-grid{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.toolbar,.no-print,.hamb{display:none !important}.main{margin-left:0}.content{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ccc}body{background:#fff}}
</style>
</head>
<body>

<div id="login-screen"></div>

  <div class="main">

    <main class="content" id="content"></main>
  </div>
</div>
<div id="sb-backdrop"></div>
<div id="modal-root"></div>

const PHRASE_KEYS=Object.keys(DICT).filter(k=>/[—,?]\s*$|\s$/.test(k)||k.length>=20).sort((a,b)=>b.length-a.length);
function t(s){if(LANG==='en'||s==null)return s;const k=String(s).trim();return DICT[k]||s;}

// Translate rendered DOM to Gujarati: exact text-node matches, long-phrase substrings, and placeholder/title attributes.
function applyLang(root){
  if(!root||LANG==='en')return;
  try{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);const nodes=[];let n;
    while(n=walker.nextNode())nodes.push(n);
    nodes.forEach(node=>{let raw=node.nodeValue;const key=raw.trim();if(!key)return;
      if(DICT[key]){node.nodeValue=raw.replace(key,DICT[key]);return;}
      let out=raw,changed=false;
      for(const p of PHRASE_KEYS){if(out.indexOf(p)>=0){out=out.split(p).join(DICT[p]);changed=true;}}
      if(changed)node.nodeValue=out;
    });
    ['placeholder','title','aria-label'].forEach(at=>root.querySelectorAll('['+at+']').forEach(e=>{const v=e.getAttribute(at);if(v&&DICT[v.trim()])e.setAttribute(at,DICT[v.trim()]);}));
  }catch(e){}
}

/* ========================= SELECTORS ========================= */
const SEL={
  // orders / pipeline
  ordersByStage(st){return DB.orders.filter(o=>o.stage===st);},
  ordersFor(rid){return DB.orders.filter(o=>o.retailerId===rid);},
  activeOrders(){return DB.orders.filter(o=>o.stage!=='delivered');},
  inTransit(){return DB.orders.filter(o=>o.stage==='dispatched');},
  toReview(){return DB.orders.filter(o=>o.stage==='review');},
  toAssign(){return DB.orders.filter(o=>o.stage==='material_in');},
  reworks(){return DB.orders.filter(o=>o.stage==='rework');},
  // stock (real-time)
  totalStockPcs(form){return DB.stock.filter(s=>!form||s.form===form).reduce((a,s)=>a+s.pcs,0);},
  totalStockCt(form){return +DB.stock.filter(s=>!form||s.form===form).reduce((a,s)=>a+s.ct,0).toFixed(2);},
  stockValue(){return DB.stock.reduce((a,s)=>a+Math.round(s.rate*s.ct),0);},
  lowStock(){return DB.stock.filter(s=>s.pcs<=s.reorder);},
  // finance (ADMIN ONLY — confidential salaries never leak)
  income(){return DB.finance.filter(f=>f.type==='income').reduce((a,f)=>a+f.amount,0);},
  expenses(){return DB.finance.filter(f=>f.type==='expense').reduce((a,f)=>a+f.amount,0);},
  expensesByCat(cat){return DB.finance.filter(f=>f.type==='expense'&&f.category===cat).reduce((a,f)=>a+f.amount,0);},
  netProfit(){return SEL.income()-SEL.expenses();},
  salaryTotal(){return DB.finance.filter(f=>f.confidential).reduce((a,f)=>a+f.amount,0);},
  // workers
  workerLoad(wid){const os=DB.orders.filter(o=>o.workerId===wid);return{total:os.length,open:os.filter(o=>['pending_accept','rejected_by_worker','polishing','review','rework'].includes(o.stage)).length,done:os.filter(o=>['certified','dispatched','delivered'].includes(o.stage)).length,wages:os.filter(o=>['certified','dispatched','delivered'].includes(o.stage)).reduce((a,o)=>a+o.wage,0)};},
  // retailer money
  retailerBilled(rid){return SEL.ordersFor(rid).reduce((a,o)=>a+o.amount,0);},
  retailerPaid(rid){return SEL.ordersFor(rid).reduce((a,o)=>a+o.paid,0);},
  unreadNotifs(){return 0;},
  revenue(){return DB.orders.reduce((a,o)=>a+o.amount,0);},
  // new-stage + entry/issue selectors
  pendingAccept(){return DB.orders.filter(o=>o.stage==='pending_accept');},
  workerRejected(){return DB.orders.filter(o=>o.stage==='rejected_by_worker');},
  pendingWork(){return DB.orders.filter(o=>['material_in','polishing','review','rework'].includes(o.stage));},
  myJobs(wid){return DB.orders.filter(o=>o.workerId===wid);},
  entries(){return DB.entries||[];},
  issues(){return DB.issues||[];},
  openIssues(){return (DB.issues||[]).filter(i=>i.status!=='resolved');},
  // per-person finance (BUG-04): work given, output, wages, paid, balance
  personLedger(wid){
    const ents=(DB.entries||[]).filter(e=>e.workerId===wid);
    const workGiven=ents.reduce((a,e)=>a+e.amount,0); // value of work handed to the karigar
    const outputCt=ents.reduce((a,e)=>a+(e.ct||0),0);
    const wages=SEL.workerLoad(wid).wages;            // wages earned on certified+ orders
    const w=byId(DB.users,wid)||byId(DB.workers,wid);
    const outputValue=Math.round(outputCt*(w?.wageRate||800)*3); // illustrative output valuation (confirm formula)
    return {workGiven,outputCt,outputValue,wages,entries:ents.length,balance:outputValue-workGiven};
  },
  monthKey(d){return String(d).slice(0,7);},
};

let modalStack=[];
function openModal({title,body,footer,size=''}){
  const overlay=el('div',{class:'overlay',onclick:e=>{if(e.target===overlay)closeModal();}});
  const modal=el('div',{class:'modal '+size});
  const xb=el('button',{class:'x-btn',title:'Close',onclick:closeModal});xb.append(el('span',{class:'act-ic',html:svg('x')}),el('span',{},'Close'));
  modal.append(el('div',{class:'modal-head'},el('h3',{},title),xb));
  const bodyEl=el('div',{class:'modal-body'});if(typeof body==='string')bodyEl.innerHTML=body;else bodyEl.append(body);
  modal.append(bodyEl);
  if(footer){const f=el('div',{class:'modal-foot'});(Array.isArray(footer)?footer:[footer]).forEach(x=>f.append(x));modal.append(f);}
  overlay.append(modal);$('#modal-root').append(overlay);modalStack.push(overlay);applyLang(overlay);return{overlay,modal,body:bodyEl};
}
function closeModal(){const m=modalStack.pop();if(m){m.style.opacity='0';setTimeout(()=>m.remove(),150);}}

function dataTable({columns,rows,searchKeys,pageSize=10,emptyText='No records found.',onRowClick,toolbar,rowClass}){
  const wrap=el('div');const state={q:'',sort:null,dir:1,page:1};
  const bar=el('div',{class:'toolbar'});
  if(searchKeys){const s=el('div',{class:'search',html:svg('search')});s.append(el('input',{type:'text',placeholder:'Search…',oninput:e=>{state.q=e.target.value.toLowerCase();state.page=1;render();}}));bar.append(s);}
  if(toolbar)(Array.isArray(toolbar)?toolbar:[toolbar]).forEach(t=>bar.append(t));
  wrap.append(bar);
  const card=el('div',{class:'card'}),tblWrap=el('div',{class:'tbl-wrap'}),pager=el('div',{class:'pager'});
  card.append(tblWrap,pager);wrap.append(card);
  function filtered(){let r=rows.slice();if(state.q&&searchKeys)r=r.filter(row=>searchKeys.some(k=>String(typeof k==='function'?k(row):row[k]??'').toLowerCase().includes(state.q)));if(state.sort){const c=columns.find(x=>x.key===state.sort);r.sort((a,b)=>{let va=c.sortVal?c.sortVal(a):a[c.key],vb=c.sortVal?c.sortVal(b):b[c.key];if(typeof va==='string')return va.localeCompare(vb)*state.dir;return(va-vb)*state.dir;});}return r;}
  function render(){
    const data=filtered(),pages=Math.max(1,Math.ceil(data.length/pageSize));if(state.page>pages)state.page=pages;
    const slice=data.slice((state.page-1)*pageSize,state.page*pageSize);
    const tbl=el('table',{class:'tbl'}),thead=el('thead'),tr=el('tr');
    columns.forEach(c=>{const th=el('th',{class:c.align==='r'?'r':''},c.label||'');if(c.sortable!==false&&c.key){th.style.cursor='pointer';th.onclick=()=>{if(state.sort===c.key)state.dir*=-1;else{state.sort=c.key;state.dir=1;}render();};if(state.sort===c.key)th.innerHTML=(c.label||'')+' '+(state.dir>0?'▲':'▼');}tr.append(th);});
    thead.append(tr);tbl.append(thead);
    const tb=el('tbody');
    if(!slice.length)tb.append(el('tr',{},el('td',{colspan:columns.length},el('div',{class:'tbl-empty',html:svg('box')+'<div>'+esc(emptyText)+'</div>'}))));
    else slice.forEach(row=>{const trr=el('tr',{class:(onRowClick?'clickable ':'')+(rowClass?rowClass(row):'')});if(onRowClick)trr.onclick=()=>onRowClick(row);columns.forEach(c=>{const td=el('td',{class:c.align==='r'?'r':''});const v=c.render?c.render(row):row[c.key];if(v&&v.nodeType)td.append(v);else td.innerHTML=v??'';trr.append(td);});tb.append(trr);});
    tbl.append(tb);tblWrap.innerHTML='';tblWrap.append(tbl);
    pager.innerHTML='';pager.append(el('span',{},`Showing ${data.length?((state.page-1)*pageSize+1):0}–${Math.min(state.page*pageSize,data.length)} of ${data.length}`));
    const pg=el('div',{class:'pages'});
    pg.append(el('button',{onclick:()=>{if(state.page>1){state.page--;render();}},disabled:state.page<=1?'':null,html:'‹'}));
    for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-state.page)<=2)pg.append(el('button',{class:i===state.page?'active':'',onclick:()=>{state.page=i;render();}},String(i)));else if(Math.abs(i-state.page)===3)pg.append(el('span',{class:'muted'},'…'));}
    pg.append(el('button',{onclick:()=>{if(state.page<pages){state.page++;render();}},disabled:state.page>=pages?'':null,html:'›'}));
    pager.append(pg);
  }
  render();wrap._refresh=render;return wrap;
}
function field({label,name,type='text',value='',options,required,hint,placeholder,min,step,rows,col}){
  const f=el('div',{class:'field'+(col?' full':'')});
  if(label)f.append(el('label',{html:esc(label)+(required?' <span class="req">*</span>':'')}));
  let input;
  if(type==='select'){input=el('select',{class:'select',name});(options||[]).forEach(o=>{const opt=el('option',{value:o.value});opt.textContent=o.label;if(String(o.value)===String(value))opt.selected=true;input.append(opt);});}
  else if(type==='textarea'){input=el('textarea',{class:'input',name,rows:rows||3,placeholder:placeholder||''});input.value=value;}
  else{input=el('input',{class:'input',name,type,placeholder:placeholder||''});input.value=value;if(min!=null)input.min=min;if(step!=null)input.step=step;}
  if(required)input.dataset.required='1';
  f.append(input);if(hint)f.append(el('div',{class:'hint'},hint));f.append(el('div',{class:'errmsg'},'This field is required'));return f;
}
function readForm(formEl){const data={};let valid=true;$$('[name]',formEl).forEach(inp=>{const fe=inp.closest('.field');fe?.classList.remove('invalid');let v=inp.value.trim();if(inp.dataset.required&&!v){valid=false;fe?.classList.add('invalid');}if(inp.type==='number')v=v===''?'':Number(v);data[inp.name]=v;});return{data,valid};}
function exportCSV(filename,headers,rows){const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};const csv=[headers.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\n');const a=el('a',{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:filename});a.click();toast('Exported',filename,'ok');}
function barChart(data,series){const max=Math.max(1,...data.flatMap(d=>series.map(s=>d.values[s.key]||0)));const chart=el('div',{class:'barchart'});data.forEach(d=>{const col=el('div',{class:'bc-col'}),bars=el('div',{class:'bc-bars'});series.forEach(s=>{const b=el('div',{class:'bc-bar',title:s.label+': '+(d.values[s.key]||0)});b.style.height=((d.values[s.key]||0)/max*100)+'%';b.style.background=s.color;bars.append(b);});col.append(bars,el('div',{class:'bc-label'},d.label));chart.append(col);});const w=el('div');w.append(chart);const lg=el('div',{class:'legend'});series.forEach(s=>lg.append(el('span',{html:`<i style="background:${s.color}"></i>${esc(s.label)}`})));w.append(lg);return w;}
function donut(segments){const total=segments.reduce((s,x)=>s+x.value,0)||1;let off=0;const r=54,c=2*Math.PI*r;const circles=segments.map(s=>{const len=s.value/total*c;const e=`<circle r="${r}" cx="75" cy="75" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return e;}).join('');const w=el('div',{class:'donut-wrap'});w.innerHTML=`<svg class="donut" viewBox="0 0 150 150">${circles}<text x="75" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${total}</text><text x="75" y="90" text-anchor="middle" font-size="10" fill="var(--ink-3)">total</text></svg>`;const lg=el('div',{class:'legend',style:'flex-direction:column;gap:8px;flex:1'});segments.forEach(s=>lg.append(el('span',{html:`<i style="background:${s.color}"></i>${esc(s.label)} <b style="margin-left:auto;color:var(--ink)">${NUM(s.value)}</b>`})));w.append(lg);return w;}
function statCard({label,value,meta,icon,color='var(--brand)',bg}){return el('div',{class:'stat',style:'--accent:'+color,html:`<div class="flex justify-between items-center"><div class="label">${svg(icon)} ${esc(label)}</div><div class="ic" style="background:${bg||'color-mix(in srgb,'+color+' 12%,transparent)'};color:${color}">${svg(icon)}</div></div><div class="value">${value}</div>${meta?`<div class="meta">${meta}</div>`:''}`});}
function tableFrom(headers,rows){const t=el('table',{class:'tbl'});t.innerHTML='<thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}"><div class="tbl-empty">${svg('box')}<div>No records</div></div></td></tr>`)+'</tbody>';return t;}
function rowActions(actions){const wrap=el('div',{class:'row-acts',onclick:e=>e.stopPropagation()});actions.forEach(a=>{const b=el('button',{class:'btn btn-sm act-btn'+(a.danger?' act-danger':''),title:a.title,onclick:a.onclick});b.append(el('span',{class:'act-ic',html:svg(a.icon)}),el('span',{},a.title));wrap.append(b);});return wrap;}
function pageHead(title,desc,actions){const h=el('div',{class:'page-head'});h.append(el('div',{},el('h1',{},title),desc?el('p',{},desc):''));if(actions){const a=el('div',{class:'acts flex gap-8 wrap no-print'});(Array.isArray(actions)?actions:[actions]).forEach(x=>a.append(x));h.append(a);}return h;}
function sampleBanner(){return el('div',{class:'banner banner-info',html:`${svg('info')}<div><strong>Prototype with sample data.</strong> All figures are demo data for evaluation, not real business records. Data persists in this browser; reset anytime from Settings.</div>`});}
function notFound(w){return el('div',{class:'denied',html:svg('alert')+`<h3>${w} not found</h3>`});}
function denied(){return el('div',{class:'denied',html:svg('shield')+'<h3>Access denied</h3><p>You don\'t have permission to view this.</p>'});}
function statusBadge(st){return st==='active'?'<span class="badge badge-ok"><span class="dot"></span>Active</span>':'<span class="badge badge-mut"><span class="dot"></span>Inactive</span>';}
function payChip(o){const bal=o.amount-o.paid;return bal<=0?'<span class="badge badge-ok">Paid</span>':(o.paid>0?'<span class="badge badge-warn">Part-paid</span>':'<span class="badge badge-bad">Unpaid</span>');}

/* ========================= STOCK ADJUST (real-time) ========================= */
function stockAdjust(form,quality,grade,dPcs,dCt,reason,ref){
  let lot=DB.stock.find(s=>s.form===form&&s.quality===quality&&s.grade===grade);
  if(!lot){lot={id:uid('st'),code:(form==='rough'?'RGH-':'PLS-')+(DB.stock.length+1),form,quality,grade,rate:form==='rough'?100000:160000,pcs:0,ct:0,reorder:form==='rough'?40:20,createdAt:today()};DB.stock.push(lot);}
  lot.pcs=Math.max(0,lot.pcs+dPcs);lot.ct=Math.max(0,+(lot.ct+dCt).toFixed(2));
  DB.stockMoves.unshift({id:uid('sm'),at:nowISO(),form,quality,grade,pcs:dPcs,ct:dCt,reason,ref});
  if(DB.stockMoves.length>300)DB.stockMoves.length=300;
}

function pipelineTracker(o){
  const curStep=STAGES[o.stage].step;
  const wrap=el('div',{class:'pipeline'});
  FLOW.forEach(k=>{const st=STAGES[k];let cls='';if(o.stage==='rework'&&k==='review')cls='rework';else if(st.step<curStep)cls='done';else if(st.step===curStep&&o.stage!=='rework')cls='current';else if(o.stage==='rework'&&k==='polishing')cls='current';
    const h=o.history.filter(x=>x.stage===k).slice(-1)[0];
    wrap.append(el('div',{class:'pipe-step '+cls,html:`<div class="ps-dot">${svg(st.icon)}</div><div class="ps-label">${st.label}</div>${h?`<div class="ps-time">${fmtDate(h.at)}</div>`:''}`}));
  });
  return wrap;
}

/* ========================= LIVE DISPATCH MAP ========================= */
let ACTIVE_TIMERS=[];
function clearTimers(){ACTIVE_TIMERS.forEach(t=>clearInterval(t));ACTIVE_TIMERS=[];}
function etaText(iso){if(!iso)return '—';const ms=new Date(iso)-Date.now();if(ms<=0)return 'Arriving now';const m=Math.round(ms/60000);if(m<60)return m+' min';return Math.floor(m/60)+'h '+(m%60)+'m';}

function renderLiveMap(o,{live=false}={}){
  const d=o.dispatch;const wrap=el('div');
  const map=el('div',{class:'map-box'});
  const delivered=o.stage==='delivered';
  map.innerHTML=`
    <div class="live-chip">${delivered?svg('checkCircle'):'<span class="pulse"></span>'} ${delivered?'Delivered':'Live tracking'}</div>
    <div class="map-route"></div>
    <div class="map-node" style="left:12%"><div class="mn-dot" style="background:var(--navy)">${svg('store')}</div><div class="mn-lbl">Workshop · Surat</div></div>
    <div class="map-node" style="left:88%"><div class="mn-dot" style="background:var(--ok)">${svg('pin')}</div><div class="mn-lbl">${esc(byId(DB.retailers,o.retailerId)?.city||'Retailer')}</div></div>
    <div class="map-truck" id="truck-${o.id}" style="left:${12+ (d?.progress||0)*76}%"><div class="mt-ic">${svg('truck')}</div></div>
    <div class="map-eta"><div><b>${delivered?'Delivered':'In transit'}</b> · ${esc(d?.courier||'—')} <span class="muted">(${esc(d?.trackingNo||'—')})</span></div>
      <div id="eta-${o.id}">${delivered?('Delivered '+ago(d?.deliveredAt)):('ETA '+etaText(d?.eta))} · ${Math.round((d?.progress||0)*100)}%</div></div>`;
  wrap.append(map);
  wrap.append(el('div',{class:'banner banner-gold mt-12',html:`${svg('info')}<div><span class="assume">${svg('flag')} Simulated</span> This is an illustrative live-tracking demo. In production this plots the real courier GPS/parcel-scan feed on a map; here the position advances on a simulated route so you can see the experience.</div>`}));
  if(live&&!delivered&&d){
    const t=setInterval(()=>{
      const ord=byId(DB.orders,o.id);if(!ord||!ord.dispatch||ord.stage==='delivered'){clearInterval(t);return;}
      ord.dispatch.progress=Math.min(0.97,ord.dispatch.progress+0.015);
      saveDB();
      const tr=document.getElementById('truck-'+o.id);if(tr)tr.style.left=(12+ord.dispatch.progress*76)+'%';
      const et=document.getElementById('eta-'+o.id);if(et)et.textContent='ETA '+etaText(ord.dispatch.eta)+' · '+Math.round(ord.dispatch.progress*100)+'%';
    },2000);
    ACTIVE_TIMERS.push(t);
  }
  return wrap;
}

/* ========================= DATA-ENTRY DASHBOARD & MODULE (BUG-01/05) ========================= */
function dashDataEntry(c){
  c.append(pageHead('Data Entry Dashboard','Record daily work — your entries become Final on save'));
  c.append(sampleBanner());
  const mine=(DB.entries||[]).filter(e=>e.createdBy===SESSION.id);
  const g=el('div',{class:'stat-grid mb-16'});
  g.append(
    statCard({label:'My Entries',value:mine.length,meta:'Recorded',icon:'edit',color:'var(--info)'}),
    statCard({label:'Final',value:mine.filter(e=>e.status==='final').length,meta:'Locked',icon:'checkCircle',color:'var(--ok)'}),
    statCard({label:'With Issues',value:mine.filter(e=>e.issues&&e.issues.length).length,meta:'Raised later',icon:'flag',color:'var(--warn)'}),
    statCard({label:'Total Entries',value:(DB.entries||[]).length,meta:'All data entry',icon:'orders',color:'var(--brand)'}),
  );
  c.append(g);
  c.append(el('div',{class:'flex gap-8 mb-16'},el('button',{class:'btn btn-primary',onclick:()=>dataEntryForm()},svg('plus'),'New Data Entry')));
  const b=el('div',{class:'card'});const bw=el('div',{class:'tbl-wrap'});
  bw.append(tableFrom(['Ref','Date','Dept','Work Type','Material','Qty','Amount','Status'],mine.slice(0,10).map(e=>['<span class="mono">'+e.id+'</span>',fmtDate(e.date),e.department,esc(e.workType),esc(e.material),e.qty,INR(e.amount),e.status==='final'?'<span class="badge badge-ok">Final</span>':'<span class="badge badge-mut">Draft</span>'])));
  b.append(bw);c.append(b);
}
function viewDataEntry(){
  const c=$('#content');c.innerHTML='';
  c.append(pageHead('Data Entry','Daily work records — saved entries are Final and can have issues raised later',[
    el('button',{class:'btn',onclick:()=>exportCSV('data-entries.csv',['Ref','Date','Dept','Work Type','Material','Qty','Ct','Amount','Worker','Status'],(DB.entries||[]).map(e=>[e.id,e.date,e.department,e.workType,e.material,e.qty,e.ct,e.amount,byId(DB.users,e.workerId)?.name,e.status]))},svg('download'),'Export'),
    ...(can('dataentry')?[el('button',{class:'btn btn-primary',onclick:()=>dataEntryForm()},svg('plus'),'New Entry')]:[]),
  ]));
  c.append(dataTable({columns:[
    {key:'id',label:'Ref',render:e=>`<span class="mono fw-600">${e.id}</span>`},
    {key:'date',label:'Date',render:e=>fmtDate(e.date),sortVal:e=>new Date(e.date)},
    {key:'department',label:'Dept'},
    {key:'workType',label:'Work Type'},
    {key:'material',label:'Material',render:e=>esc(e.material)},
    {key:'qty',label:'Qty',align:'r',render:e=>e.qty+'<br><span class="muted fs-12">'+CT(e.ct)+'</span>'},
    {key:'amount',label:'Amount',align:'r',render:e=>INR(e.amount)},
    {key:'worker',label:'Karigar',render:e=>esc(byId(DB.users,e.workerId)?.name||byId(DB.workers,e.workerId)?.name||'—')},
    {key:'status',label:'Status',render:e=>e.status==='final'?'<span class="badge badge-ok"><span class="dot"></span>Final</span>':'<span class="badge badge-mut">Draft</span>'+(e.issues&&e.issues.length?' <span class="badge badge-warn">Issue</span>':'')},
    {key:'act',label:'',sortable:false,render:e=>rowActions([{icon:'flag',title:'Raise issue',onclick:()=>raiseIssue(e)},{icon:'eye',title:'View',onclick:()=>entryDetail(e)}])},
  ],rows:DB.entries||[],searchKeys:['id','department','workType','material'],pageSize:10,onRowClick:e=>entryDetail(e)}));
}
function dataEntryForm(){
  const DEPTS=['Polishing','Cutting','Grading','Dispatch','Other'];
  const form=el('form',{class:'form-grid'});
  form.append(
    field({label:'Date',name:'date',type:'date',value:today(),required:true}),
    field({label:'Department',name:'department',type:'select',value:'Polishing',required:true,options:DEPTS.map(d=>({value:d,label:d}))}),
    field({label:'Work Type',name:'workType',type:'select',value:'Polishing',required:true,options:WORK_TYPES.map(t=>({value:t,label:t}))}),
    field({label:'Karigar',name:'workerId',type:'select',value:DB.workers[0]?.id,options:DB.workers.map(w=>({value:w.id,label:w.name}))}),
    field({label:'Material',name:'material',value:'',required:true,placeholder:'e.g. VS1 F rough'}),
    field({label:'Quantity (pcs)',name:'qty',type:'number',min:0,value:'',required:true}),
    field({label:'Carats',name:'ct',type:'number',min:0,step:0.01,value:''}),
    field({label:'Amount (₹)',name:'amount',type:'number',min:0,value:'',required:true}),
  );
  form.append(el('div',{class:'banner banner-info full',style:'grid-column:1/-1',html:`${svg('info')}<div>On save, this entry is marked <b>Final</b> and a stock movement is recorded automatically.</div>`}));
  const save=el('button',{class:'btn btn-primary',onclick:e=>{e.preventDefault();const{data,valid}=readForm(form);if(!valid)return toast('Check the form','Fill required fields','warn');
    const id='DE-'+(3000+(DB.entries||[]).length+Math.floor(Math.random()*900)+1);
    const entry={id,...data,status:'final',issues:[],createdBy:SESSION.id,createdAt:nowISO()};
    DB.entries=DB.entries||[];DB.entries.push(entry);
    // BUG-07: data entry updates stock automatically (consume rough material)
    const q=(data.material||'').trim().split(' ')[0]; const gg=(data.material||'').split(' ')[1];
    if(QUALITIES.includes(q)&&GRADES.includes(gg))stockAdjust('rough',q,gg,-Math.abs(data.qty||0),-Math.abs(data.ct||0),'Consumed — '+id,id);
    pushNotif('entry','ok','Data entry saved',id+' ('+data.department+') marked Final','#/dataentry');
    logAudit('Data entry','entry',id);saveDB();closeModal();toast('Saved',id+' · Final','ok');router();
  }},svg('save'),'Save (Final)');
  openModal({size:'lg',title:'New Data Entry',body:form,footer:[el('button',{class:'btn',onclick:closeModal},'Cancel'),save]});
}
function entryDetail(e){
  const body=el('div');
  const iss=(DB.issues||[]).filter(i=>(e.issues||[]).includes(i.id));
  body.innerHTML=`<div class="card card-pad mb-16">
    <div class="flex justify-between items-center mb-12"><div class="fs-18 fw-800 mono">${e.id}</div><span class="badge badge-ok">Final</span></div>
    <div class="kv"><span class="k">Date</span><span class="v">${fmtDate(e.date)}</span></div>
    <div class="kv"><span class="k">Department</span><span class="v">${esc(e.department)}</span></div>
    <div class="kv"><span class="k">Work type</span><span class="v">${esc(e.workType)}</span></div>
    <div class="kv"><span class="k">Material</span><span class="v">${esc(e.material)}</span></div>
    <div class="kv"><span class="k">Quantity</span><span class="v">${e.qty} pcs / ${CT(e.ct)}</span></div>
    <div class="kv"><span class="k">Amount</span><span class="v">${INR(e.amount)}</span></div>
    <div class="kv"><span class="k">Karigar</span><span class="v">${esc(byId(DB.users,e.workerId)?.name||byId(DB.workers,e.workerId)?.name||'—')}</span></div></div>`;
  if(iss.length){const ic=el('div',{class:'card card-pad'});ic.innerHTML='<div class="panel-title mb-12">Issues</div>'+iss.map(i=>`<div class="kv"><span class="k">${esc(i.title)}</span><span class="v">${issueBadge(i.status)}</span></div>`).join('');body.append(ic);}
  openModal({size:'lg',title:'Entry — '+e.id,body,footer:[el('button',{class:'btn',onclick:()=>{closeModal();raiseIssue(e);}},svg('flag'),'Raise Issue'),el('button',{class:'btn btn-primary',onclick:closeModal},'Close')]});
}
function issueBadge(st){return st==='open'?'<span class="badge badge-bad"><span class="dot"></span>Open</span>':st==='under_review'?'<span class="badge badge-warn"><span class="dot"></span>Under review</span>':'<span class="badge badge-ok"><span class="dot"></span>Resolved</span>';}
function raiseIssue(e){
  const form=el('form');
  form.append(field({label:'Issue title',name:'title',required:true,col:true}),field({label:'Describe the problem',name:'desc',type:'textarea',required:true,col:true,placeholder:'What is wrong — to discuss with the karigar and correct'}));
  const btn=el('button',{class:'btn btn-primary',onclick:ev=>{ev.preventDefault();const{data,valid}=readForm(form);if(!valid)return toast('Fill the form','','warn');
    const id='ISS-'+(4000+(DB.issues||[]).length+Math.floor(Math.random()*900)+1);
    DB.issues=DB.issues||[];DB.issues.push({id,entryId:e.id,title:data.title,desc:data.desc,status:'open',raisedBy:SESSION.id,raisedAt:nowISO(),corrections:[]});
    e.issues=e.issues||[];e.issues.push(id);
    pushNotif('issue','bad','Issue raised',id+' on '+e.id+': '+data.title,'#/issues');
    logAudit('Raised issue','issue',id);saveDB();closeModal();toast('Issue raised',id,'warn');router();
  }},svg('flag'),'Raise Issue');
  openModal({title:'Raise Issue — '+e.id,body:form,footer:[el('button',{class:'btn',onclick:closeModal},'Cancel'),btn]});
}
function viewIssues(){
  const c=$('#content');c.innerHTML='';
  c.append(pageHead('Issues','Problems raised on Final entries — discuss, correct and resolve'));
  const g=el('div',{class:'stat-grid mb-16'});
  const by=st=>(DB.issues||[]).filter(i=>i.status===st).length;
  g.append(
    statCard({label:'Open',value:by('open'),meta:'Need attention',icon:'flag',color:'var(--bad)'}),
    statCard({label:'Under Review',value:by('under_review'),meta:'Being corrected',icon:'eye',color:'var(--warn)'}),
    statCard({label:'Resolved',value:by('resolved'),meta:'Closed',icon:'checkCircle',color:'var(--ok)'}),
  );
  c.append(g);
  c.append(dataTable({columns:[
    {key:'id',label:'Ref',render:i=>`<span class="mono fw-600">${i.id}</span>`},
    {key:'title',label:'Issue',render:i=>`<b>${esc(i.title)}</b><br><span class="muted fs-12">on ${i.entryId}</span>`},
    {key:'raised',label:'Raised',render:i=>fmtDateTime(i.raisedAt)+'<br><span class="muted fs-12">'+esc(byId(DB.users,i.raisedBy)?.name||'—')+'</span>',sortVal:i=>new Date(i.raisedAt)},
    {key:'status',label:'Status',render:i=>issueBadge(i.status)},
    {key:'act',label:'',sortable:false,render:i=>rowActions([{icon:'eye',title:'Open',onclick:()=>issueDetail(i)}])},
  ],rows:DB.issues||[],searchKeys:['id','title','entryId'],pageSize:10,onRowClick:i=>issueDetail(i),emptyText:'No issues raised.'}));
}
function issueDetail(i){
  const body=el('div');
  body.innerHTML=`<div class="card card-pad mb-16"><div class="flex justify-between items-center mb-8"><div class="fw-800">${esc(i.title)}</div>${issueBadge(i.status)}</div>
    <div class="muted fs-13 mb-12">On entry <b>${i.entryId}</b> · raised ${fmtDateTime(i.raisedAt)} by ${esc(byId(DB.users,i.raisedBy)?.name||'—')}</div>
    <div>${esc(i.desc)}</div></div>`;
  const tl=el('div',{class:'card card-pad mb-16'});tl.innerHTML='<div class="panel-title mb-12">Correction history</div>';
  const t=el('div',{class:'timeline'});(i.corrections||[]).forEach(cx=>t.append(el('div',{class:'tl-item',html:`<div class="tl-title">${esc(cx.note)}</div><div class="tl-meta">${fmtDateTime(cx.at)} · ${esc(byId(DB.users,cx.by)?.name||'—')}</div>`})));
  if(!(i.corrections||[]).length)t.append(el('div',{class:'muted fs-13'},'No corrections logged yet.'));
  tl.append(t);body.append(tl);
  const foot=[el('button',{class:'btn',onclick:closeModal},'Close')];
  if(can('issues')&&i.status!=='resolved'){
    foot.unshift(el('button',{class:'btn btn-ok',onclick:()=>{i.status='resolved';i.corrections.push({at:nowISO(),by:SESSION.id,note:'Marked resolved'});logAudit('Resolved issue','issue',i.id);saveDB();closeModal();toast('Resolved',i.id,'ok');router();}},svg('check'),'Resolve'));
    foot.unshift(el('button',{class:'btn',onclick:()=>{const note=prompt('Correction note (discussed with karigar):');if(note){i.status='under_review';i.corrections.push({at:nowISO(),by:SESSION.id,note});saveDB();closeModal();toast('Updated',i.id,'ok');router();}}},svg('edit'),'Add correction'));
  }
  openModal({size:'lg',title:'Issue — '+i.id,body,footer:foot});
}

/* ========================= WORKER PANEL: MY WORK (BUG-02) ========================= */

  const c=$('#content');c.innerHTML='';
  c.append(pageHead('Pending Work','Every order not yet certified'));
  const g=el('div',{class:'stat-grid mb-16'});
  g.append(
    statCard({label:'To Assign',value:SEL.toAssign().length,meta:'Material in',icon:'worker',color:'var(--warn)'}),
    statCard({label:'In Polishing',value:SEL.ordersByStage('polishing').length,meta:'Karigars working',icon:'polish',color:'var(--purple)'}),
    statCard({label:'Rework',value:SEL.reworks().length,meta:'Sent back to redo',icon:'redo',color:'var(--bad)'}),

  );
  c.append(g);
  const canOpen=can('production');
  c.append(dataTable({columns:[
    {key:'id',label:'Order',render:o=>`<span class="mono fw-600">${o.id}</span>`},
    {key:'retailer',label:'Retailer',render:o=>esc(byId(DB.retailers,o.retailerId)?.name||'—')},
    {key:'q',label:'Quality',render:o=>o.quality+' '+o.grade},
    {key:'worker',label:'Karigar',render:o=>esc(byId(DB.workers,o.workerId)?.name||'—')},
    {key:'stage',label:'Stage',render:o=>stageBadge(o.stage)},

  ],rows:SEL.pendingWork(),searchKeys:['id',o=>byId(DB.retailers,o.retailerId)?.name],pageSize:12,onRowClick:canOpen?(o=>location.hash='#/production/'+o.id):null,emptyText:'Nothing pending — all caught up.'}));
}

/* ========================= WORKER LIVE LOCATION TRACKING (BUG-03) ========================= */
let SIM_TIMER=null;
function startSim(){
  if(SIM_TIMER||!DB.settings.realtimeSim)return;
  SIM_TIMER=setInterval(()=>{
    if(!SESSION){clearInterval(SIM_TIMER);SIM_TIMER=null;return;}
    // advance in-transit dispatches
    let changed=false;
    DB.orders.forEach(o=>{if(o.stage==='dispatched'&&o.dispatch&&o.dispatch.progress<0.97){o.dispatch.progress=Math.min(0.97,o.dispatch.progress+0.01);changed=true;}});
    if(changed){saveDB();const dot=document.querySelector('#notif-btn');/* refresh dispatch page truck handled locally */}
  },5000);
}

/* ========================= ROUTER ========================= */
function currentRoute(){return(location.hash.replace('#/','').split('/')[0])||'dashboard';}
function router(){
  if(!SESSION)return;
  clearTimers();
  const parts=location.hash.replace('#/','').split('/');
  let route=parts[0]||'dashboard';const param=parts[1];
  // retailers land on My Orders
  if(SESSION.role==='retailer'&&(route==='dashboard'||route==='')){location.hash='#/myorders';return;}
  if(route!=='profile'&&!can(route)){$('#content').innerHTML='';$('#content').append(denied());renderSidebar(route);renderTopbar(route);return;}
  renderSidebar(route);renderTopbar(route);
  $('#sidebar').classList.remove('open');$('#sb-backdrop').classList.remove('show');
  window.scrollTo(0,0);
  const routes={
    dashboard:viewDashboard,
    production:()=>param?viewOrderDetail(param):viewProduction(),
    pending:viewPending,
    dataentry:viewDataEntry,
    issues:viewIssues,
    stock:viewStock,
    workers:viewWorkers,
    retailers:()=>param?viewRetailerDetail(param):viewRetailers(),
    finance:viewFinance,
    reports:viewReports,
    settings:viewSettings,
    profile:viewProfile,
    myorders:()=>viewMyOrders(param),
    tracking:()=>viewTracking(param),
  };
  (routes[route]||viewDashboard)();
  applyLang(document.getElementById('content'));applyLang(document.getElementById('sidebar'));applyLang(document.getElementById('topbar'));
}

/* ========================= BOOT ========================= */
function bootApp(){
  $('#login-screen').style.display='none';
  $('#app').style.display='block';
  if(!location.hash||location.hash==='#')location.hash=homeRoute();
  router();startSim();
}
function init(){
  try{const t=localStorage.getItem('bsd2_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){PERSIST=false;}
  loadDB();loadSession();
  window.addEventListener('hashchange',router);
  if(SESSION&&(byId(DB.users,SESSION.id)||SESSION.role==='retailer')){bootApp();}
  else{SESSION=null;saveSession();renderLogin();$('#login-screen').style.display='grid';}
}
document.addEventListener('DOMContentLoaded',init);
